{% extends "base_dashboard.html" %}

{% block title %}
    Edit Staff
{% endblock %}

{% block sidebar %}

    <h4 class="text-center mb-4">Admin Panel</h4>

    <a href="{{ url_for('admin.admin_dashboard') }}">
        Dashboard
    </a>

    <a href="{{ url_for('admin.list_treks') }}">
        Manage Treks
    </a>

    <a href="{{ url_for('admin.pending_staff') }}" >
        Staff Approval Requests
    </a>

    <a href="{{ url_for('admin.list_staff') }}">
        Manage Staff
    </a>

    <a href="{{ url_for('admin.list_users') }}">
        Manage Users
    </a>

    <a href="{{ url_for('admin.list_bookings') }}">
        View Bookings
    </a>

{% endblock %}

{% block content %}

    <h2 class="dashboard-title">
        Edit Staff
    </h2>

    <div class="info-card">

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">Username</label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    value="{{user.username}}"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">Password</label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Leave blank to keep current password">

            </div>

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                    <input
                        type="text"
                        name="full_name"
                        class="form-control"
                        value="{{ user.full_name }}"
                        required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        value="{{ user.email }}"
                        required>
            </div>

            <div class="mb-3">

                <label class="form-label">
                    Phone Number
                </label>

                <input
                    type="text"
                    name="phone"
                    class="form-control"
                    value="{{staff_profile.phone}}"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Experience (Years)
                </label>

                <input
                    type="number"
                    name="experience"
                    class="form-control"
                    value="{{staff_profile.experience}}"
                    required>

            </div>

            <button
                type="submit"
                class="btn btn-success">
                Update Staff
            </button>

            <a 
                href="{{ url_for('admin.list_staff') }}"
                class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

{% endblock %}
